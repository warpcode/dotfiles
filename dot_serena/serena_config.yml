# the language backend to use for code understanding and manipulation.
language_backend: LSP

# line ending convention to use when writing source files.
line_ending: native

# whether to open a graphical window with Serena's logs.
gui_log_window: false

# whether to start the Serena Dashboard.
web_dashboard: false

# whether to open the Dashboard window/browser tab when Serena starts.
web_dashboard_open_on_launch: false

web_dashboard_interface:
web_dashboard_listen_address: 127.0.0.1
web_dashboard_trusted_hosts:
- 127.0.0.1
- localhost

log_level: 20
trace_lsp_communication: false
ls_specific_settings: {}
ls_priorities:
ignored_paths: []
read_only_memory_patterns: []
ignored_memory_patterns: []
tool_timeout: 240
excluded_tools: []
included_optional_tools: []
fixed_tools: []

base_modes:
- interactive
- editing
default_modes:

default_max_tool_answer_chars: 150000
token_count_estimator: CHAR_COUNT
symbol_info_budget: 10
project_serena_folder_location: "$projectDir/.serena"
trusted_project_path_patterns: []
projects: []
