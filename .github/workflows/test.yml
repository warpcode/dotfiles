---
name: Test Dotfiles
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '**/*.zsh'
      - 'install.sh'
      - '.gitmodules'
      - 'assets/configs/**/*'
      - 'generic/**/*'
      - '.github/skills/jira-api/scripts/**'
  pull_request:
    branches:
      - master
    paths:
      - '**/*.zsh'
      - 'install.sh'
      - '.gitmodules'
      - 'assets/configs/**/*'
      - 'generic/**/*'
      - '.github/skills/jira-api/scripts/**'

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test-linux:
    name: test-linux-${{ matrix.container }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        container:
          - ubuntu:latest
          - debian:latest
          - fedora:latest
          - archlinux:latest
    container: ${{ matrix.container }}
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install dotfiles using install.sh
      - name: Install dotfiles
        run: |
          export DOTFILES="$(pwd)"
          export DOTFILES_SKIP_CHSHELL=1
          ./install.sh --profile default --git-name "CI Test" --git-email "ci@example.com"

      - name: Run Jira API Skill Tests
        run: python3 -m unittest discover -s .github/skills/jira-api/scripts/tests/

  test-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      # Install Homebrew
      - name: Install Homebrew
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install dotfiles using install.sh
      - name: Install dotfiles
        run: |
          export DOTFILES="$(pwd)"
          export DOTFILES_SKIP_CHSHELL=1
          ./install.sh --profile default --git-name "CI Test" --git-email "ci@example.com"

      - name: Run Jira API Skill Tests
        run: python3 -m unittest discover -s .github/skills/jira-api/scripts/tests/
