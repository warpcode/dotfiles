---
name: Test Dotfiles
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '**/*.zsh'
      - 'install.sh'
      - '.gitmodules'
      - 'assets/configs/**/*'
      - 'generic/**/*'
  pull_request:
    branches:
      - master
    paths:
      - '**/*.zsh'
      - 'install.sh'
      - '.gitmodules'
      - 'assets/configs/**/*'
      - 'generic/**/*'

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test-linux:
    name: test-linux-${{ matrix.container }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        container:
          - ubuntu:latest
          - debian:latest
          - fedora:latest
          - archlinux:latest
    container: ${{ matrix.container }}
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install dotfiles using install.sh
      - name: Install dotfiles
        run: |
          export DOTFILES="$(pwd)"
          export DOTFILES_SKIP_CHSHELL=1
          ./install.sh --profile default --git-name "CI Test" --git-email "ci@example.com"

      - name: Run Zsh tests
        run: |
          set -eu
          found=0
          for f in dot_zsh/tests/*.test.zsh; do
            [ -f "$f" ] || continue
            found=1
            echo "::group::$f"
            zsh "$f"
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "No zsh test files matched dot_zsh/tests/*.test.zsh" >&2
            exit 1
          fi

  test-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      # Install Homebrew
      - name: Install Homebrew
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install dotfiles using install.sh
      - name: Install dotfiles
        run: |
          export DOTFILES="$(pwd)"
          export DOTFILES_SKIP_CHSHELL=1
          ./install.sh --profile default --git-name "CI Test" --git-email "ci@example.com"

      - name: Run Zsh tests
        run: |
          set -eu
          found=0
          for f in dot_zsh/tests/*.test.zsh; do
            [ -f "$f" ] || continue
            found=1
            echo "::group::$f"
            zsh "$f"
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "No zsh test files matched dot_zsh/tests/*.test.zsh" >&2
            exit 1
          fi
